<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guía Turística — Panamá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- STICKY HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-eyebrow" id="txt-eyebrow">Guía de Viaje</span>
        <h1 class="header-title">Panamá</h1>
      </div>
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">
        <span class="lang-active" id="langLabel">EN</span>
      </button>
    </div>

    <!-- FILTER TABS -->
    <nav class="filter-nav" role="tablist">
      <button class="filter-btn active" data-region="ciudad" id="btn-ciudad" role="tab">
        <span id="txt-ciudad">Ciudad de Panamá</span>
      </button>
      <button class="filter-btn" data-region="provincias" id="btn-provincias" role="tab">
        <span id="txt-provincias">Provincias</span>
      </button>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- HERO -->
    <section class="hero">
      <p class="hero-sub" id="txt-hero-sub">Descubre lo mejor de</p>
      <h2 class="hero-heading" id="txt-hero-heading">La Encrucijada del Mundo</h2>
    </section>

    <!-- CARDS GRID -->
    <section class="cards-section">
      <div class="cards-grid" id="cardsGrid"></div>
    </section>

    <!-- EMERGENCY SECTION -->
    <section class="emergency-section" id="emergencySection">
      <div class="emergency-header">
        <span class="section-eyebrow" id="txt-emerg-eyebrow">Asistencia</span>
        <h2 class="section-title" id="txt-emerg-title">Números de Emergencia</h2>
      </div>
      <ul class="emergency-list" id="emergencyList"></ul>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
      <p id="txt-footer">Diseñado para viajeros en Panamá · Información sujeta a cambios</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
